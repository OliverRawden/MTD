# Optional: lets GitHub run the nightly update and publish to GitHub Pages for free.
# Only active once Oliver creates the repo and enables Pages (Settings > Pages > Source: GitHub Actions).
name: nightly-update
on:
  schedule: [{cron: "30 2 * * *"}]   # 02:30 UTC daily
  workflow_dispatch: {}
  push: {branches: [main]}
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4
      - name: Fetch HMRC list, diff, build
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then python3 scripts/update.py --no-fetch; else python3 scripts/update.py; fi
      - name: Commit data changes
        run: |
          git config user.name "mtd-finder-bot"; git config user.email "actions@users.noreply.github.com"
          git add data && git diff --cached --quiet || (git commit -m "data: nightly HMRC update $(date +%F)" && git push)
      - uses: actions/upload-pages-artifact@v3
        with: {path: public}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages}
    steps:
      - uses: actions/deploy-pages@v4
