# Nightly HMRC refresh + GitHub Pages deploy (free; runs on GitHub, not the box).
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: nightly-update
on:
  schedule: [{cron: "30 2 * * *"}]   # 02:30 UTC = 02:30 London in winter (GMT), 03:30 in summer (BST)
  workflow_dispatch: {}
  push: {branches: [main]}
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
env: {TZ: Europe/London}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Fetch HMRC list, diff, build
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then python3 scripts/update.py --no-fetch; else python3 scripts/update.py; fi
      - name: Commit data only if HMRC's list actually changed
        run: |
          # products.json / last_checked.json carry a fetch timestamp every night; a real change always
          # adds a new snapshot and a changes.json entry, so only commit then.
          if git diff --quiet -- data/changes.json && [ -z "$(git ls-files --others --exclude-standard data/snapshots)" ]; then
            echo "HMRC list unchanged; nothing committed."
          else
            git config user.name "mtd-finder-bot"; git config user.email "actions@users.noreply.github.com"
            git add data && git commit -m "data: HMRC list update $(date +%F)" && git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with: {path: public}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
